name: Agregar manual Promocion de la Salud HIS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/agregar-manual-promocion.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  agregar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Crear ficha, renombrar PDF y actualizar indice
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path

          D = Path("knowledge/minsa/manuales-his")
          ORIGINAL = D / "Manual de registro y codificación de las actividades de promoción de la salud.pdf"
          FINAL = D / "Manual-promocion_salud-2024.pdf"
          FICHA = D / "Manual-promocion_salud-2024.metadata.json"
          MANIFEST = Path("data/metadata/manuales-his/manifest.json")
          SHA = "c0ffb5ea049dab68d6675fa19a6046f5b76fba2595c72a36bd8a8c6ef6dbcc02"
          PAGINAS = 167
          ID = "MINSA-HIS-PROMOCION-SALUD-2024-" + SHA[:10]
          TITULO = "Manual de Registro y Codificación de las Actividades de Promoción de la Salud"

          if FICHA.exists():
              print("Nada que hacer: la ficha ya existe.")
              sys.exit(0)

          if not ORIGINAL.exists():
              print("No encuentro el PDF original subido. No se cambia nada.")
              sys.exit(1)

          real = hashlib.sha256(ORIGINAL.read_bytes()).hexdigest()
          if real != SHA:
              print("El PDF no coincide con el revisado. No se cambia nada.")
              sys.exit(1)

          def guardar(p, data):
              txt = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
              p.write_bytes(txt.replace("\n", "\r\n").encode("utf-8"))

          # 1) Quitar archivo vacio con el nombre final y renombrar el PDF real
          if FINAL.exists() and FINAL.stat().st_size < 1024:
              subprocess.run(["git", "rm", "-q", "--", str(FINAL)], check=True)
          subprocess.run(["git", "mv", "--", str(ORIGINAL), str(FINAL)], check=True)

          # 2) Crear ficha
          ficha = {
            "id": ID,
            "titulo": TITULO,
            "institucion": "Ministerio de Salud del Perú",
            "bibliografia": "Ministerio de Salud del Perú. " + TITULO + ". 2da edición. Lima: Ministerio de Salud; 2024. Sistema de Información HIS.",
            "anio_publicacion": 2024,
            "tipo_documento": "Manual de registro y codificación de actividades de salud",
            "sistema": "Sistema de Información HIS",
            "area_responsable": "Dirección de Promoción de la Salud (DPROM); Oficina General de Tecnologías de la Información (OGTI)",
            "grupo_etario": "General",
            "temas": [
              "promoción de la salud",
              "registro HIS",
              "codificación HIS",
              "atención integral de salud",
              "programas presupuestales"
            ],
            "palabras_clave": [
              "promoción de la salud",
              "HIS",
              "registro",
              "codificación",
              "PPoR"
            ],
            "idioma": "es",
            "archivo_origen": FINAL.name,
            "paginas_total": PAGINAS,
            "sha256": SHA,
            "url_oficial": None,
            "pdf_oficial": "https://bvs.minsa.gob.pe/local/MINSA/7318.pdf",
            "estado_validacion": "METADATOS_EXTRAIDOS_DEL_PDF_SIN_VERIFICACION_EN_FUENTE_OFICIAL",
            "tipo_fuente": "pdf",
            "regla_evidencia": "Al responder, conservar la página exacta del PDF como evidencia; no inferir códigos que el documento no indique.",
            "notas_metadatos": [
              "La ficha de catalogación del documento indica 165 páginas; el archivo PDF tiene 167. Se registra el total del archivo.",
              "La dirección pdf_oficial proviene de la página 2 del propio PDF (versión digital) y no ha sido verificada en línea.",
              "El archivo se subió con el nombre «Manual de registro y codificación de las actividades de promoción de la salud.pdf» y se renombró al estándar del repositorio."
            ]
          }
          guardar(FICHA, ficha)

          # 3) Indice
          raw = MANIFEST.read_bytes()
          m = json.loads(raw.decode("utf-8-sig"))
          if not any(d["id"] == ID for d in m["documentos"]):
              m["documentos"].append({
                "id": ID,
                "archivo": FINAL.name,
                "titulo": TITULO,
                "anio_publicacion": 2024,
                "paginas_total": PAGINAS,
                "sha256": SHA
              })
          m["numero_documentos"] = len(m["documentos"])
          txt = json.dumps(m, ensure_ascii=False, indent=2) + "\n"
          if b"\r\n" in raw:
              txt = txt.replace("\n", "\r\n")
          MANIFEST.write_bytes(txt.encode("utf-8"))

          # 4) Comprobar
          pdfs = len([p for p in D.iterdir() if p.suffix.lower() == ".pdf"])
          fichas = len(list(D.glob("*.metadata.json")))
          print(f"PDFs: {pdfs} | Fichas: {fichas} | Indice: {len(m['documentos'])}")
          if not (pdfs == fichas == len(m["documentos"]) == 13):
              print("Cantidad inesperada, no se guarda nada.")
              sys.exit(1)
          PY

          git add -A knowledge/minsa/manuales-his data/metadata/manuales-his
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Agregar manual de Promocion de la Salud 2024: PDF renombrado, ficha e indice (13 manuales)"
          git push
