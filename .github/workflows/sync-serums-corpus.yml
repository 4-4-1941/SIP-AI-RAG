name: Sincronizar corpus SERUMS 2026-II

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write

concurrency:
  group: serums-2026-ii-corpus
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dependencias
        run: pip install -r backend/requirements.txt

      - name: Sincronizar y materializar corpus oficial
        run: python rag/ingestion/serums_sync.py --materialize

      - name: Validar corpus
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("knowledge/minsa/serums-2026-ii/manifest.json")
          if not path.exists():
              raise SystemExit("Falta manifest.json")

          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("compendios_descubiertos") != 17:
              raise SystemExit(f"Compendios inválidos: {data.get('compendios_descubiertos')}")
          if data.get("documentos_unicos", 0) <= 0:
              raise SystemExit("No se descubrieron documentos oficiales.")
          if data.get("documentos_materializados_rag", 0) <= 0:
              raise SystemExit("No se materializó contenido RAG.")

          print("VALIDADO")
          print("Compendios:", data["compendios_descubiertos"])
          print("Documentos únicos:", data["documentos_unicos"])
          print("Materializados:", data["documentos_materializados_rag"])
          print("Fallos:", data.get("fallos", 0))

      - name: Commit del corpus actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/minsa/serums-2026-ii
          if git diff --cached --quiet; then
            echo "Sin cambios en el corpus."
            exit 0
          fi
          git commit -m "chore(rag): sincroniza corpus SERUMS 2026-II"
          git push
