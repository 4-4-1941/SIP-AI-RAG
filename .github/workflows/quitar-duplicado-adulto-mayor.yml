name: Quitar duplicado Adulto Mayor HIS

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/quitar-duplicado-adulto-mayor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Quitar ficha repetida y corregir titulo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          D = Path("knowledge/minsa/manuales-his")
          FICHA_B = D / "MANUAL DE REGISTRO Y CODIFICACION DE LA ATENCION DE SALUD EN LA CONSULTA EXTERNA.metadata.json"
          FICHA_A = D / "Manual de Registro y Codificacion de Adulto Mayor_2025.metadata.json"
          MANIFEST = Path("data/metadata/manuales-his/manifest.json")
          TITULO = "Manual de Registro y Codificación de la Atención de Salud en la Consulta Externa. Curso de Vida Adulto Mayor"
          BIBLIO = "Ministerio de Salud del Perú. " + TITULO + ". 2025. Sistema de Información HIS."

          if not FICHA_B.exists():
              print("Nada que hacer: la ficha repetida ya no existe.")
              sys.exit(0)

          def leer(p):
              raw = p.read_bytes()
              crlf = b"\r\n" in raw
              return json.loads(raw.decode("utf-8-sig")), crlf

          def guardar(p, data, crlf):
              txt = json.dumps(data, ensure_ascii=False, indent=2) + "\n"
              if crlf:
                  txt = txt.replace("\n", "\r\n")
              p.write_bytes(txt.encode("utf-8"))

          # 1) Ficha A: titulo real de la portada
          a, crlf = leer(FICHA_A)
          a["titulo"] = TITULO
          a["bibliografia"] = BIBLIO
          guardar(FICHA_A, a, crlf)

          # 2) Manifest: quitar B, corregir titulo de A, actualizar cantidad
          m, crlf = leer(MANIFEST)
          docs = [d for d in m["documentos"] if not d["id"].startswith("MINSA-HIS-ADULTO-MAYOR-2025-B-")]
          for d in docs:
              if d["id"].startswith("MINSA-HIS-ADULTO-MAYOR-2025-A-"):
                  d["titulo"] = TITULO
          m["documentos"] = docs
          m["numero_documentos"] = len(docs)
          guardar(MANIFEST, m, crlf)

          # 3) Borrar ficha B
          subprocess.run(["git", "rm", "-q", "--", str(FICHA_B)], check=True)

          # 4) Comprobar
          pdfs = len([p for p in D.iterdir() if p.suffix.lower() == ".pdf"])
          fichas = len(list(D.glob("*.metadata.json")))
          print(f"PDFs: {pdfs} | Fichas: {fichas} | Manifest: {len(docs)}")
          if not (pdfs == fichas == len(docs) == 12):
              print("Cantidad inesperada, no se guarda nada.")
              sys.exit(1)
          PY

          git add -A knowledge/minsa/manuales-his data/metadata/manuales-his
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Quitar ficha repetida de Adulto Mayor y corregir titulo; manifest queda en 12 manuales"
          git push
