name: Vigilancia normativa MINSA SERUMS
"on":
  workflow_dispatch: {}
  schedule:
    - cron: "17 13 * * *"
permissions:
  contents: write
jobs:
  vigilancia:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest
      - run: |
          python -m py_compile rag/ingestion/el_peruano_sync.py
          python -m pytest -q tests/test_rag_core.py tests/test_normative_surveillance.py
      - name: Revisar publicaciones oficiales MINSA
        run: python rag/ingestion/el_peruano_sync.py --sheets 3
      - name: Guardar solo si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metadata/serums/serums-normas.json knowledge/normas/serums
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(normas): incorpora novedades oficiales SERUMS [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
